name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency: npm-publish
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
          
      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
        
      - name: Check package
        run: npm run check
          
      - name: Publish to npm
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          if npm view "aiwrapper@$VERSION" version --registry=https://registry.npmjs.org > published-version.txt 2> registry-error.txt; then
            echo "aiwrapper@$VERSION is already published"
            exit 0
          fi
          if ! grep -q 'E404' registry-error.txt; then
            cat registry-error.txt >&2
            exit 1
          fi
          npm publish --ignore-scripts --access public
