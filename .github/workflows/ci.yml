name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Committed catalog matches the submodule
        run: |
          npm run aimodels:build
          test -z "$(git status --porcelain -- src/aimodels)" || {
            git status --short -- src/aimodels
            echo 'src/aimodels/ is stale; run npm run aimodels:build and commit it' >&2
            exit 1
          }
      - run: npm run check

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - run: npm ci
      - run: npm ci --prefix playground
      - run: npm run check:playground

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo package --locked -p aiwrapper
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm run native:test:sandbox
