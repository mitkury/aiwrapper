name: Update AIModels Dependency

on:
  repository_dispatch:
    types:
      - aimodels-package-updated

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Get aimodels version
        id: version
        run: |
          VERSION=$(echo '${{ github.event.client_payload }}' | jq -er '.version | select(type == "string" and length > 0)')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Update aimodels dependency
        run: |
          npm install aimodels@${{ steps.version.outputs.version }}

      - name: Build and test
        run: npm run check
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit dependency update
        run: |
          git add package.json package-lock.json
          git commit -m "deps: update aimodels to v${{ steps.version.outputs.version }}"
          git push
      
      - name: Version patch and trigger release
        run: |
          npm version patch -m "deps: release patch after aimodels v${{ steps.version.outputs.version }}"
          git push --follow-tags
      
      - name: Output version info
        run: |
          echo "Updated aimodels to version ${{ steps.version.outputs.version }} and queued the tagged release"
