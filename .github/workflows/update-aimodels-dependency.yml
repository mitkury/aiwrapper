name: Update AIModels Dependency

concurrency: aimodels-dependency-update

on:
  repository_dispatch:
    types:
      - aimodels-package-updated

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Get aimodels version
        id: version
        run: |
          VERSION=$(jq -er '.client_payload.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"))' "$GITHUB_EVENT_PATH")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      
      - name: Update aimodels dependency
        id: update
        env:
          AIMODELS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install "aimodels@$AIMODELS_VERSION"
          INSTALLED_VERSION=$(node -p "require('./node_modules/aimodels/package.json').version")
          if [ "$INSTALLED_VERSION" != "$AIMODELS_VERSION" ]; then
            echo "Expected aimodels $AIMODELS_VERSION but installed $INSTALLED_VERSION" >&2
            exit 1
          fi
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        if: steps.update.outputs.changed == 'true'
        run: npm run check
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit dependency update
        if: steps.update.outputs.changed == 'true'
        env:
          AIMODELS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add package.json package-lock.json
          git commit -m "deps: update aimodels to v$AIMODELS_VERSION"
          git push
      
      - name: Version patch and trigger release
        if: steps.update.outputs.changed == 'true'
        env:
          AIMODELS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version patch -m "deps: release patch after aimodels v$AIMODELS_VERSION"
          git push --follow-tags
      
      - name: Output version info
        env:
          AIMODELS_VERSION: ${{ steps.version.outputs.version }}
          CHANGED: ${{ steps.update.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "Updated aimodels to version $AIMODELS_VERSION and queued the tagged release"
          else
            echo "aimodels is already at version $AIMODELS_VERSION"
          fi
