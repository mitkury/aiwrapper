[package]
name = "aiwrapper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Embeddable async language providers and tool agents for Rust"
repository = "https://github.com/mitkury/aiwrapper"
readme = "README.md"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std"] }

[[example]]
name = "sandbox"
path = "examples/sandbox.rs"
