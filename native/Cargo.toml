[package]
name = "aiwrapper"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A Universal AI Wrapper for Rust"
repository = "https://github.com/mitkury/aiwrapper"
documentation = "https://docs.rs/aiwrapper"
readme = "README.md"
keywords = ["llm", "ai", "agents", "openai", "anthropic"]
categories = ["api-bindings", "asynchronous", "multimedia::audio"]

[features]
default = ["catalog"]
# Embedded AIModels catalog: default output limits, reasoning gating and `aiwrapper::models()`.
catalog = ["dep:aimodels"]

[dependencies]
aimodels = { version = "0.1", optional = true }
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std"] }

[[example]]
name = "sandbox"
path = "examples/sandbox.rs"
